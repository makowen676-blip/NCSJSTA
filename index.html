<script>
//<core> — matching engine (unchanged from the original matcher)
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);
const ph9=s=>{const d=String(s||'').replace(/\D/g,'');return d.length>=9?d.slice(-9):''};
const isMasked=p=>/[*xX]/.test(p||'');
function pat9(p){let c=String(p||'').replace(/[\s+]/g,'').replace(/[*xX]/g,'.');c=c.replace(/^254/,'').replace(/^0/,'');return c}
function fits(reg,pt){if(!reg)return false;if(pt.length===9)return[...pt].every((ch,i)=>ch==='.'||ch===reg[i]);
  const a=(pt.match(/^\d*/)||[''])[0],b=(pt.match(/\d*$/)||[''])[0];return(a.length+b.length>=3)&&reg.startsWith(a)&&reg.endsWith(b)}
function parseMsg(line){
  line=line.trim();if(!line)return null;
  let code=(line.match(/^([A-Z0-9]{10})\s+Confirmed/)||[])[1]||'';
  let am=line.match(/Ksh\.?\s?([\d,]+(?:\.\d+)?)/i);
  if(am){let m=line.match(/from\s+([^\d*]+?)\s+((?:\+?254|0)?[71][\dXx*\s]{6,}?)\s+on\s/i)||line.match(/from\s+(.+?)\s+on\s/i);
    let name=m?m[1]:'',phone=m&&m[2]?m[2].replace(/\s/g,''):'';
    return{code,amount:parseFloat(am[1].replace(/,/g,'')),name,phone,raw:line}}
  let n=line.match(/^(?:\d+\s*\.\s*)?(.+?)\s*[-–:]\s*(\d[\d,]*)\s*\/?-?\s*$/);
  if(n)return{code:'',amount:parseFloat(n[2].replace(/,/g,'')),name:n[1].trim(),phone:'',raw:line};
  let p=line.match(/(?:\+?254|0)?[71]\d{8}/);
  return{code:'',amount:null,name:line.replace(p?p[0]:'','').trim(),phone:p?p[0]:'',raw:line}}
const share=(t,m)=>{const u=norm(m.name);return t.filter(x=>u.includes(x)).length};
function findMember(members,p){
  const t=norm(p.name);
  if(p.phone&&!isMasked(p.phone)){const k=ph9(p.phone);const h=members.filter(m=>ph9(m.phone)===k);if(h.length===1)return{m:h[0],how:'phone'}}
  if(p.phone&&isMasked(p.phone)){const pt=pat9(p.phone);let c=members.filter(m=>fits(ph9(m.phone),pt));
    if(c.length===1)return share(t,c[0])>0?{m:c[0],how:'phone (partial) + name'}:{m:c[0],how:'partial phone only',weak:true};
    if(c.length>1){const best=Math.max(...c.map(m=>share(t,m)));const d=c.filter(m=>share(t,m)===best);
      if(best>0&&d.length===1)return{m:d[0],how:'phone (partial) + name'}}}
  if(!t.length)return{};
  let best=0,c=[];
  members.forEach(m=>{const u=norm(m.name);const s=share(t,m);const need=Math.min(2,t.length,u.length);
    if(s>=need&&s>0){if(s>best){best=s;c=[m]}else if(s==best)c.push(m)}});
  if(c.length==1)return{m:c[0],how:'name',weak:true};
  if(c.length>1)return{amb:c};
  return{}}
//</core>

/* ================= STATE ================= */
const ORG='NJORO SUB COUNTY JUNIOR SCHOOL TEACHERS WELFARE',SHORT='NSCJSTA';
const EMAIL={chair:'chair@nscjsta.app',sec:'secretary@nscjsta.app',tre:'treasurer@nscjsta.app'};
const ROLEOF=Object.fromEntries(Object.entries(EMAIL).map(([k,v])=>[v,k]));
const ROLES={chair:{t:'Chairperson',ic:'👑'},sec:{t:'Secretary',ic:'📝'},tre:{t:'Treasurer',ic:'💰'}};
const PERM={chair:['members','cases','record','payoutReq','payoutApprove','settings','import','export','delete'],sec:['members','cases','import','export'],tre:['record','payoutReq','export']};
const can=a=>role&&(S.fullRights!==false||PERM[role].includes(a));
const fresh=()=>({officials:null,members:[],cases:[],pay:{},payouts:[],seen:[],log:[],disputes:[],defAmt:100,nid:1});
let recMode='mp',dFilt='open';
let S=fresh(),role=null,authReady=false,loaded=false,syncErr='',unsub=null,view='home',arg=null,lastRes=[],filt='all',selCase=null,gMode='both',gAmt=true;
/* ================= FIREBASE (shared data + sign-in) ================= */
const FB=typeof firebase!=='undefined'&&typeof FIREBASE_CONFIG!=='undefined';
let auth,REF;
if(FB){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();const db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});REF=db.doc('welfare/main')}
const save=()=>{if(!REF)return;REF.set(JSON.parse(JSON.stringify(S))).catch(e=>toast(e.code==='permission-denied'?'⚠ Not allowed to save':'⚠ Could not save: '+(e.message||e)))};
function softRender(){const a=document.activeElement;if(role&&a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}
function listen(){if(unsub)return;
  unsub=REF.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites&&loaded)return;
    S=snap.exists?Object.assign(fresh(),snap.data()):fresh();loaded=true;syncErr='';softRender()},
  e=>{syncErr=e.code==='permission-denied'?'This account is not allowed to open the register.':(e.message||String(e));loaded=true;render()})}
if(FB)auth.onAuthStateChanged(u=>{authReady=true;
  if(u){role=ROLEOF[(u.email||'').toLowerCase()]||null;if(!role){auth.signOut();toast('This account has no role');return}listen()}
  else{role=null;loaded=false;S=fresh();if(unsub){unsub();unsub=null}}
  render()});
addEventListener('online',()=>render());addEventListener('offline',()=>render());
const uid=()=>S.nid++;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'KES '+Number(n||0).toLocaleString();
const hash=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const who=()=>role?`${ROLES[role].t} ${S.officials?.[role]?.name||''}`.trim():'System';
function log(msg){S.log.unshift({t:Date.now(),who:who(),msg});S.log.length=Math.min(S.log.length,300)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)}
const ini=n=>(String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('')||'?').toUpperCase();
const nextNo=()=>String(Math.max(0,...S.members.map(m=>parseInt(m.no)||0))+1).padStart(3,'0');
const openCases=()=>S.cases.filter(c=>c.status==='open');
const openDisputes=()=>(S.disputes||[]).filter(d=>d.status==='open');
function addDispute(c,p,reason,cands){S.disputes=S.disputes||[];
  const key=(p.code||'')+'|'+norm(p.name).join(' ')+'|'+p.amount+'|'+(c?c.id:'');
  if(S.disputes.some(d=>d.key===key&&d.status==='open'))return;
  S.disputes.unshift({id:uid(),key,caseId:c?c.id:null,code:p.code||'',name:p.name||p.raw||'',phone:p.phone||'',amount:p.amount,reason,cands:(cands||[]).map(m=>m.id),raw:p.raw||'',date:Date.now(),status:'open',note:''})}
/* Group list ("1. Mary Kiarie – 100") parser: reads the PAID section, ignores YET TO PAY */
function parseGroupList(text,defAmt){
  let sec=null,seenHead=false;const out=[];
  text.split('\n').forEach(raw=>{const line=raw.replace(/[*_~`]/g,'').trim();if(!line)return;
    if(/yet\s*to\s*pay|not\s*paid|unpaid|pending/i.test(line)){sec='yet';seenHead=true;return}
    if(/^[✅✔☑\s]*paid\b/i.test(line)||/\bpaid\s*\(/i.test(line)){sec='paid';seenHead=true;return}
    if(/^(📊|contribution|deadline|for:|updated|total|collected|please|thank)/i.test(line)||/^[^\w]*nscjsta/i.test(line))return;
    if(sec==='yet')return;
    const m=line.match(/^(?:\d+\s*[.)]\s*)?([A-Za-z][A-Za-z.'\s]+?)\s*(?:[-–—:=]+\s*(?:ksh\.?|kes)?\s*([\d,]+)\s*(?:\/-|\/=)?)?\s*$/i);
    if(!m)return;const name=m[1].trim();if(norm(name).length<1)return;
    out.push({code:'',name,phone:'',amount:m[2]?parseFloat(m[2].replace(/,/g,'')):defAmt,raw:line})});
  return out}
/* Member list paste: "001 Mary Kiarie 0712345678 Njoro Central" or "Mary Kiarie, 0712345678, school" */
function parseMemberList(text){
  return text.split('\n').map(l=>l.replace(/\t/g,',').trim()).filter(Boolean).map(l=>{
    const pm=l.match(/(?:\+?254|0)?[71]\d{8}/);let phone=pm?'0'+ph9(pm[0]):'';let rest=pm?l.replace(pm[0],pm.index>0&&!/[,|;]/.test(l.slice(0,pm.index))?',':' '):l;
    let no='';const nm=rest.match(/^\s*(\d{1,5})\s*[.)\-,]?\s+(?=[A-Za-z])/);if(nm){no=nm[1].padStart(3,'0');rest=rest.slice(nm[0].length)}
    const parts=rest.split(/[,|;]+/).map(s=>s.trim()).filter(Boolean);
    const name=(parts[0]||'').replace(/\s+/g,' ').replace(/[^A-Za-z.'\s-]/g,'').trim();
    if(norm(name).length<1)return null;return{no,name,phone,station:parts.slice(1).join(' ').trim()}}).filter(Boolean)}
function applyMemberList(list){let up=0,add=0;
  list.forEach(r=>{let m=null;
    if(r.phone)m=S.members.find(x=>ph9(x.phone)===ph9(r.phone));
    if(!m&&r.no)m=S.members.find(x=>String(x.no)===r.no&&(norm(x.name).some(t=>norm(r.name).includes(t))));
    if(!m){const k=norm(r.name).join(' ');m=S.members.find(x=>norm(x.name).join(' ')===k)}
    if(m){if(r.name)m.name=r.name;if(r.phone)m.phone=r.phone;if(r.station)m.station=r.station;up++}
    else{S.members.push({id:uid(),no:r.no||nextNo(),name:r.name,phone:r.phone,station:r.station});add++}});
  log(`Member list pasted: ${up} updated, ${add} added`);save();render();toast(`✔ ${up} updated, ${add} added`)}

function importAoa(aoa){
  const hr=aoa.findIndex(r=>r.some(c=>/member\s*no/i.test(c)));
  if(hr<0)return toast('Could not find the "Member No" header row');
  const H=aoa[hr].map(x=>String(x||''));
  const ci={no:H.findIndex(c=>/member\s*no/i.test(c)),name:H.findIndex(c=>/^name/i.test(c)),phone:H.findIndex(c=>/phone/i.test(c)),st:H.findIndex(c=>/(work\s*)?station|school/i.test(c))};
  const last=Math.max(ci.no,ci.name,ci.phone);
  const cc=H.map((h,i)=>i>last&&i!==ci.st&&h.trim()&&!/^(total|remarks?|notes?)/i.test(h.trim())?i:-1).filter(i=>i>=0);
  S.members=[];S.cases=[];S.pay={};S.payouts=[];S.seen=[];
  const cs=cc.map((i,k)=>{const c={id:uid(),title:H[i].trim(),beneficiary:'',amount:S.defAmt,deadline:'',status:k===cc.length-1?'open':'closed',created:Date.now(),col:i};S.cases.push(c);S.pay[c.id]={};return c});
  for(let r=hr+1;r<aoa.length;r++){const row=aoa[r];const nm=String(row[ci.name]||'').trim();if(!nm)continue;
    const raw=String(row[ci.phone]||'').trim();
    const m={id:uid(),no:String(row[ci.no]||'').trim()||nextNo(),name:nm.replace(/\s+/g,' '),phone:ph9(raw)&&!isMasked(raw)?'0'+ph9(raw):raw,station:ci.st>=0?String(row[ci.st]||'').trim():''};S.members.push(m);
    cs.forEach(c=>{const v=parseFloat(String(row[c.col]).replace(/,/g,''));if(v>0)S.pay[c.id][m.id]=v})}
  log(`Imported register: ${S.members.length} members, ${S.cases.length} cases`);save();go('home');toast(`✔ ${S.members.length} members, ${S.cases.length} cases loaded`)}
async function exportXlsx(){
  if(!await loadXLSX())return;
  const H=['Member No','Name','Phone','Work Station',...S.cases.map(c=>c.title),'Total'];
  const rows=S.members.map(m=>{const v=S.cases.map(c=>paidOf(c,m)||'');return[m.no,m.name,m.phone,m.station||'',...v,v.reduce((a,b)=>a+(+b||0),0)]});
  const tot=['','TOTAL','','',...S.cases.map(c=>stats(c).col),S.cases.reduce((a,c)=>a+stats(c).col,0)];
  const w=XLSX.utils.aoa_to_sheet([[ORG],[],H,...rows,tot]);w['!cols']=H.map((h,i)=>({wch:i==1?28:14}));
  const b=XLSX.utils.book_new();XLSX.utils.book_append_sheet(b,w,'Register');
  const cs=XLSX.utils.aoa_to_sheet([['Case','Beneficiary','Amount per member','Deadline','Status','Paid','Members','Collected','Paid out','Balance'],...S.cases.map(c=>{const s=stats(c);return[c.title,c.beneficiary,c.amount,c.deadline,c.status,s.paid,s.total,s.col,approvedOut(c),s.col-approvedOut(c)]})]);
  XLSX.utils.book_append_sheet(b,cs,'Cases');
  const po=XLSX.utils.aoa_to_sheet([['Date','Case','Paid to','Amount','Note','Requested by','Status'],...S.payouts.map(p=>[new Date(p.date).toLocaleDateString(),S.cases.find(c=>c.id===p.caseId)?.title,p.to,p.amount,p.note,p.by,p.status])]);

function guText(c,mode,amt){

  const head=`*${SHORT} – ${c.title}*${c.beneficiary?'\nFor: '+c.beneficiary:''}\nContribution: ${fmt(c.amount)} per member${c.deadline?'\nDeadline: '+c.deadline:''}`;
  const pl=`✅ *PAID (${paid.length}):*\n`+(paid.map((m,i)=>`${i+1}. ${m.name}${amt?' – '+Number(paidOf(c,m)).toLocaleString():''}`).join('\n')||'None yet');
  const yl=`⏳ *YET TO PAY (${yet.length}):*\n`+(yet.map((m,i)=>`${i+1}. ${m.name}`).join('\n')||'None – thank you all! 🙏');

  if(mode==='yet')return`${head}\n\n${yl}\n\nPlease send your contribution. Thank you 🙏\n${foot}`;
  return`${head}\n\n${sum}\n\n${pl}\n\n${yl}\n\n${foot}`}

function resultsView(){const c=S.cases.find(x=>x.id===selCase);
  const ok=lastRes.filter(r=>r.done).length,todo=lastRes.filter(r=>r.needs&&!r.done).length,skip=lastRes.length-ok-todo;

  const ico=r.undone?'↩️':r.done?(r.s==='wn'?'⚠️':'✅'):r.needs?'❓':'⏭️';

  return`<div class="rc ${cls}"><div class="ico">${ico}</div><div class="bd"><div class="nm">${esc(r.p.name||r.p.raw)}</div>${r.p.phone?`<div class="m">${esc(r.p.phone)}</div>`:''}${r.m?`<div class="m">→ #${esc(r.m.no)} ${esc(r.m.name)}</div>`:''}<div class="m">${esc(r.undone?'Undone':r.t)}</div>${act}</div><div class="amt">${fmt(r.p.amount)}</div></div>`}).join('')}

function applyPay(cid,m,p){S.pay[cid][m.id]=p.amount;if(p.code)S.seen.push(p.code);let note='';
  if(!ph9(m.phone)&&ph9(p.phone)&&!isMasked(p.phone)){m.phone='0'+ph9(p.phone);note=' · phone saved'}return note}
function resolveFor(p,c){(S.disputes||[]).forEach(d=>{if(d.status==='open'&&d.caseId===c.id&&d.amount===p.amount&&d.code===(p.code||'')&&norm(d.name).join(' ')===norm(p.name).join(' '))d.status='done'})}
function processEntries(c,entries,gl){
  lastRes=[];
  entries.forEach(p=>{
    if(p.code&&S.seen.includes(p.code)){lastRes.push({p,s:'er',skip:true,t:'Duplicate transaction code – skipped'});return}
    const f=findMember(S.members,p);
    if(f.m){const cur=paidOf(c,f.m);
      if(cur>0){
        if(gl){lastRes.push({p,m:f.m,s:'g',skip:true,t:'Already recorded – no change'});return}
        addDispute(c,p,'Already paid '+fmt(cur)+' – possible double payment',[f.m]);
        lastRes.push({p,m:f.m,s:'wn',skip:true,did:1,t:`Already paid ${fmt(cur)} – possible double payment (saved to Disputes)`});return}
      const note=applyPay(c.id,f.m,p);
      lastRes.push({p,m:f.m,cid:c.id,s:(f.weak&&!gl)?'wn':'ok',done:true,t:'Matched by '+f.how+note+((f.weak&&!gl)?' – please verify':'')})}
    else if(f.amb){addDispute(c,p,'Several members match this name',f.amb);lastRes.push({p,s:'er',needs:true,cands:f.amb,did:1,t:'Several members match – pick the right one'})}
    else{addDispute(c,p,'Not found in the register',[]);lastRes.push({p,s:'wn',needs:true,did:1,t:'Not found in register – saved to Disputes'})}});
  const n=lastRes.filter(r=>r.done).length,k=lastRes.filter(r=>r.did).length;
  log(`${gl?'Group list':'Matched'}: ${n} of ${lastRes.length} recorded into ${c.title}${k?`, ${k} sent to Disputes`:''}`);
  save();render();toast(`✔ ${n} recorded${k?` · ${k} in Disputes`:''}`);setTimeout(()=>$('#results')?.scrollIntoView({behavior:'smooth'}),50)}
function runMatch(){
  const c=S.cases.find(x=>x.id===selCase);if(!c)return;
  const text=$('#t').value;if(!text.trim())return toast('Paste some messages first');
  S.defAmt=+$('#amt').value||S.defAmt;if(!S.members.length)return toast('Add or import members first');
  const es=[];text.split('\n').forEach(line=>{const p=parseMsg(line);if(!p)return;p.amount=p.amount??S.defAmt;es.push(p)});
  processEntries(c,es,false)}
function runGroup(){
  const c=S.cases.find(x=>x.id===selCase);if(!c)return;
  const text=$('#t').value;if(!text.trim())return toast('Paste the list first');
  if(!S.members.length)return toast('Add or import members first');
  const es=parseGroupList(text,+$('#amt').value||c.amount);
  if(!es.length)return toast('No names found in that list');
  processEntries(c,es,true)}
function disputeCard(d){
  const c=S.cases.find(x=>x.id===d.caseId),ph=ph9(d.phone),open=d.status==='open';
  const cands=(d.cands||[]).map(id=>S.members.find(m=>m.id===id)).filter(Boolean);

  const btns=(p,nm)=>{const q=ph9(p);return q?`<div class="ctc"><a href="tel:0${q}"><button type="button" class="sm">📞 Call ${esc(nm)}</button></a><a href="https://wa.me/254${q}?text=${encodeURIComponent(msg)}" target="_blank"><button type="button" class="sm s">💬 WhatsApp</button></a></div>`:''};
  return`<div class="c dc"><div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1;min-width:0"><div class="nm">${esc(d.name||'Unknown sender')}</div><div class="m">${c?esc(c.title)+' · ':''}${new Date(d.date).toLocaleDateString()}${d.code?' · '+esc(d.code):''}</div></div><div class="amt" style="font:800 16px var(--hd)">${fmt(d.amount)}</div></div>
  <div class="pill ${open?'e':'g'}" style="display:inline-block;margin:8px 0 4px">${esc(d.reason)}</div>
  ${d.phone?`<div class="m">📱 ${esc(d.phone)}${ph?'':' <i>(hidden by M-Pesa – cannot call)</i>'}</div>${btns(d.phone,(d.name||'').split(' ')[0]||'sender')}`:'<div class="m">No phone number in the message.</div>'}
  ${cands.length?`<div class="m" style="margin-top:8px"><b>Possible members:</b></div>${cands.map(m=>`<div class="row" style="cursor:default;padding:6px 0"><div class="t"><b>${esc(m.name)}</b><span class="m">#${esc(m.no)} · ${esc(m.phone)||'no phone'}</span></div></div>${btns(m.phone,m.name.split(' ')[0])}`).join('')}`:''}
  ${d.note?`<div class="m" style="margin-top:6px">📝 ${esc(d.note)}</div>`:''}
  ${open?`${can('record')&&c?`<label style="margin-top:10px;display:block">Assign to member</label><select data-dsel="${d.id}">${(cands.length?cands:S.members).map(m=>`<option value="${m.id}">${esc(m.no)} ${esc(m.name)}</option>`).join('')}</select>`:''}
  <div class="btnrow" style="margin-top:6px">${can('record')&&c?`<button class="sm" data-a="dassign" data-id="${d.id}">✔ Assign &amp; record</button>`:''}<button class="sm s" data-a="dresolve" data-id="${d.id}">Mark resolved</button>${can('delete')?`<button class="sm d" data-a="ddel" data-id="${d.id}">🗑</button>`:''}</div>`
  :`<div class="btnrow" style="margin-top:8px"><button class="sm s" data-a="dreopen" data-id="${d.id}">Reopen</button>${can('delete')?`<button class="sm d" data-a="ddel" data-id="${d.id}">🗑</button>`:''}</div>`}</div>`}
function disputesView(){

/* ================= ACTIONS ================= */
let pickR=null;
function act(a,d,el){switch(a){
  case'nav':go(d.v);break;
  case'task':d.t==='newcase'?caseForm():d.t.startsWith('case:')?go('case',+d.t.slice(5)):go(d.t);break;
  case'logout':lastRes=[];view='home';auth.signOut();break;
  case'pickrole':pickR=d.r;$('#roles').style.display='none';$('#pinf').style.display='block';$('#pt').textContent=`${ROLES[pickR].ic} ${ROLES[pickR].t}`;$('#pin').focus();break;
  case'cancelpin':$('#roles').style.display='block';$('#pinf').style.display='none';break;
  case'member':memberModal(S.members.find(m=>m.id==d.id));break;
  case'memberAdd':memberForm();break;
  case'memberEdit':document.querySelectorAll('.ov').forEach(o=>o.remove());memberForm(S.members.find(m=>m.id==d.id));break;
  case'memberDel':{const m=S.members.find(x=>x.id==d.id);document.querySelectorAll('.ov').forEach(o=>o.remove());
    confirmBox(`Delete <b>${esc(m.name)}</b> and all their payment records?`,()=>{S.members=S.members.filter(x=>x!==m);Object.values(S.pay).forEach(p=>delete p[m.id]);log('Deleted member '+m.name);save();render();toast('Deleted')},'Delete');break}
  case'newcase':caseForm();break;
  case'case':go('case',+d.id);break;
  case'caseEdit':caseForm(S.cases.find(c=>c.id==d.id));break;
  case'caseToggle':{const c=S.cases.find(x=>x.id==d.id);c.status=c.status==='open'?'closed':'open';log(`${c.status==='open'?'Reopened':'Closed'} ${c.title}`);save();render();break}
  case'caseDel':{const c=S.cases.find(x=>x.id==d.id);confirmBox(`Delete <b>${esc(c.title)}</b> with all its payments and payouts?`,()=>{S.cases=S.cases.filter(x=>x!==c);delete S.pay[c.id];S.payouts=S.payouts.filter(p=>p.caseId!==c.id);log('Deleted case '+c.title);save();go('cases')},'Delete');break}
  case'gmode':gMode=d.m;render();break;
  case'gamt':gAmt=!gAmt;render();break;
  case'gcopy':{const t=$('#gu').value;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('📋 Copied – paste in WhatsApp'),()=>{$('#gu').select();document.execCommand('copy');toast('📋 Copied')});break}
  case'gsend':window.open('https://wa.me/?text='+encodeURIComponent($('#gu').value),'_blank');break;
  case'filt':filt=d.f;render();break;
  case'pay':payModal(S.cases.find(c=>c.id==d.c),S.members.find(m=>m.id==d.id));break;
  case'torecord':selCase=+d.id;go('record');break;
  case'copyyet':{const c=S.cases.find(x=>x.id==d.id);navigator.clipboard.writeText(yetText(c)).then(()=>toast('📋 Copied'),()=>toast('Copy failed'));break}
  case'wa':{const c=S.cases.find(x=>x.id==d.id);window.open('https://wa.me/?text='+encodeURIComponent(waText(c)),'_blank');break}
  case'match':runMatch();break;
  case'gmatch':runGroup();break;
  case'recmode':recMode=d.m;lastRes=[];render();break;
  case'dfilt':dFilt=d.f;render();break;
  case'dresolve':{const x=S.disputes.find(y=>y.id==d.id);x.status='done';log('Resolved dispute: '+x.name);save();render();toast('✔ Marked resolved');break}
  case'dreopen':{const x=S.disputes.find(y=>y.id==d.id);x.status='open';save();render();break}
  case'ddel':confirmBox('Delete this dispute record?',()=>{S.disputes=S.disputes.filter(y=>y.id!=d.id);save();render()},'Delete');break;
  case'dassign':{const x=S.disputes.find(y=>y.id==d.id),v=document.querySelector(`[data-dsel="${d.id}"]`)?.value,m=S.members.find(y=>y.id==v),c=S.cases.find(y=>y.id===x.caseId);
    if(!m||!c)return toast('Choose a member first');if(c.status!=='open'&&!confirm('This case is closed. Record anyway?'))return;
    if(paidOf(c,m)>0)return toast(m.name+' has already paid this case');
    applyPay(c.id,m,{amount:x.amount,code:x.code,phone:x.phone});x.status='done';x.note='Assigned to '+m.name;log(`Dispute assigned: ${fmt(x.amount)} to ${m.name}`);save();render();toast('✔ Recorded for '+m.name);break}
  case'memberBulk':modal('Paste member list',`<div class="hint">Paste the treasurer's updated list, one member per line, e.g.<br><i>001 Mary Kiarie 0712345678 Njoro Central</i><br><i>John Doe, 0722000111, Mau Narok JS</i><br>Existing members (matched by phone or name) are updated; new ones are added. Nobody is deleted.</div><textarea name="l" placeholder="Paste here…" required></textarea>`,f=>{const l=parseMemberList(f.l);if(!l.length){toast('No names found');return false}
    applyMemberList(l)},'Update members');break;
  case'clearbox':$('#t').value='';lastRes=[];render();break;
  case'undo':{const r=lastRes[d.i];delete S.pay[r.cid][r.m.id];if(r.p.code)S.seen=S.seen.filter(x=>x!==r.p.code);r.done=false;r.undone=true;log(`Undid payment of ${r.m.name}`);save();render();break}
  case'assign':{const r=lastRes[d.i],v=document.querySelector(`[data-sel="${d.i}"]`).value;if(!v)return toast('Choose a member first');
    const m=S.members.find(x=>x.id==v),c=S.cases.find(x=>x.id===selCase);
    if(paidOf(c,m)>0)return toast(m.name+' has already paid');
    const note=applyPay(selCase,m,r.p);Object.assign(r,{m,cid:selCase,done:true,needs:false,s:'ok',t:'Assigned manually'+note});resolveFor(r.p,c);log(`Manually assigned ${fmt(r.p.amount)} to ${m.name}`);save();render();break}
  case'addnew':{const r=lastRes[d.i],m={id:uid(),no:nextNo(),name:r.p.name||'New member',phone:r.p.phone&&!isMasked(r.p.phone)?'0'+ph9(r.p.phone):''};
    S.members.push(m);applyPay(selCase,m,r.p);Object.assign(r,{m,cid:selCase,done:true,needs:false,s:'wn',t:'Added as new member '+m.no});resolveFor(r.p,S.cases.find(x=>x.id===selCase));log(`Added new member ${m.name} from payment`);save();render();break}
  case'payoutNew':{const oc=S.cases.filter(c=>stats(c).col-approvedOut(c)>0);if(!oc.length)return toast('No case has money available');
    modal('Request payout',`<label>Case</label><select name="c">${oc.map(c=>`<option value="${c.id}">${esc(c.title)} – available ${fmt(stats(c).col-approvedOut(c)-pendingOut(c))}</option>`).join('')}</select><label>Amount (KES)</label><input name="a" type="number" min="1" required><label>Paid to</label><input name="to" required placeholder="Family / beneficiary"><label>Note / M-Pesa ref</label><input name="note">`,d=>{
    const c=S.cases.find(x=>x.id==d.c),a=+d.a;if(a>stats(c).col-approvedOut(c)-pendingOut(c)){toast('More than is available for this case');return false}
    S.payouts.push({id:uid(),caseId:c.id,amount:a,to:d.to.trim(),note:d.note.trim(),by:who(),date:Date.now(),status:'pending'});log(`Requested payout ${fmt(a)} (${c.title})`);save();render();toast('Sent to Chairperson for approval')},'Submit');break}
  case'payoutAct':{const p=S.payouts.find(x=>x.id==d.id);p.status=d.s;p.decidedBy=who();log(`${d.s==='approved'?'Approved':'Rejected'} payout ${fmt(p.amount)} to ${p.to}`);save();render();toast(d.s==='approved'?'✔ Approved':'Rejected');break}
  case'export':exportXlsx();break;
  case'import':{const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=async()=>{const f=i.files[0];if(!f)return;
      if(!await loadXLSX())return;const wb=XLSX.read(await f.arrayBuffer());const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
      S.members.length?confirmBox(`This will <b>replace</b> the ${S.members.length} members and ${S.cases.length} cases on this phone with the spreadsheet. Continue?`,()=>importAoa(aoa),'Replace'):importAoa(aoa)};i.click();break}
  case'oldimport':{const o=JSON.parse(localStorage.getItem('welfare_state_v1'));importAoa(o.aoa);break}
  case'backup':dl(`NSCJSTA_backup_${stamp()}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}));log('Made backup');save();break;
  case'restore':{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());if(!o.members||!o.officials)throw 0;
      Object.values(o.officials).forEach(x=>{delete x.pin});
      confirmBox('Replace ALL data with this backup? This changes it for every official.',()=>{S=Object.assign(fresh(),o);log('Restored a backup');save();render();toast('Backup restored')},'Restore')}catch(e){toast('That is not a valid backup file')}};i.click();break}
  case'official':{const k=d.r;if(k==='chair'&&role!=='chair')return toast('Only the Chairperson can change these details');modal(ROLES[k].t,`<label>Name</label><input name="n" value="${esc(S.officials[k].name)}" required>`,f=>{
    S.officials[k].name=f.n.trim();log(`Updated ${ROLES[k].t} name`);save();render();toast('✔ Saved')});break}
  case'chpw':modal('Change my password',`<label>New password (6 or more characters)</label><input name="p" type="password" minlength="6" required autocomplete="new-password"><label>Repeat it</label><input name="q" type="password" minlength="6" required autocomplete="new-password">`,f=>{
    if(f.p!==f.q){toast('The two passwords differ');return false}
    auth.currentUser.updatePassword(f.p).then(()=>toast('✔ Password changed'),e=>toast(e.code==='auth/requires-recent-login'?'Sign out, sign in again, then retry':'Could not change: '+(e.code||e.message)))});break
  case'rights':S.fullRights=S.fullRights===false;log('Full rights for officials turned '+(S.fullRights?'ON':'OFF'));save();render();break;
  case'reset':if(role!=='chair')return toast('Only the Chairperson can do this');modal('Erase everything?',`<p>This deletes all members, cases, payments and payouts for <b>every official</b>. Type <b>ERASE</b> to confirm.</p><input name="w" autocomplete="off">`,f=>{if(f.w!=='ERASE'){toast('Type ERASE exactly');return false}S=Object.assign(fresh(),{officials:S.officials});log('Erased all data');save();render()},'Erase');break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.closest('a')&&b.tagName==='BUTTON'&&!b.dataset.a)return;act(b.dataset.a,b.dataset,b)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.in==='members')$('#lst').innerHTML=memberList(t.value);
  if(t.dataset.in==='case')$('#lst').innerHTML=caseList(S.cases.find(c=>c.id===arg),t.value)});
document.addEventListener('change',e=>{if(e.target.dataset.in==='rcase'){selCase=+e.target.value;lastRes=[]}});
document.addEventListener('submit',e=>{
  if(e.target.id==='setup'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    S.officials={};for(const k in ROLES)S.officials[k]={name:d[k+'n'].trim()};
    log('Association set up');save();render();toast('Welcome, Chairperson!')}
  if(e.target.id==='pinf'){e.preventDefault();const p=$('#pin'),btn=e.target.querySelector('button');if(!p.value)return;btn.disabled=true;
    auth.signInWithEmailAndPassword(EMAIL[pickR],p.value).then(()=>{view='home'}).catch(err=>{p.value='';p.classList.add('shake');setTimeout(()=>p.classList.remove('shake'),400);
      toast(err.code==='auth/network-request-failed'?'No internet connection':['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code)?'Wrong password':err.code==='auth/too-many-requests'?'Too many tries – wait a few minutes':'Sign-in failed: '+(err.code||err.message))}).finally(()=>{btn.disabled=false})}});
const oldData=()=>{try{return JSON.parse(localStorage.getItem('welfare_state_v1')||'null')?.aoa}catch(e){return null}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
