<script>
//<core> — matching engine
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);
const ph9=s=>{const d=String(s||'').replace(/\D/g,'');return d.length>=9?d.slice(-9):''};
const isMasked=p=>/[*xX]/.test(p||'');
function pat9(p){let c=String(p||'').replace(/[\s+]/g,'').replace(/[*xX]/g,'.');c=c.replace(/^254/,'').replace(/^0/,'');return c}
function fits(reg,pt){if(!reg)return false;if(pt.length===9)return[...pt].every((ch,i)=>ch==='.'||ch===reg[i]);
  const a=(pt.match(/^\d*/)||[''])[0],b=(pt.match(/\d*$/)||[''])[0];return(a.length+b.length>=3)&&reg.startsWith(a)&&reg.endsWith(b)}
function parseMsg(line){
  line=line.trim();if(!line)return null;
  let code=(line.match(/^([A-Z0-9]{10})\s+Confirmed/)||[])[1]||'';
  let am=line.match(/Ksh[s]?\.?\s?([\d,]+(?:\.\d+)?)/i);
  if(am){let m=line.match(/from\s+([^\d*]+?)\s+((?:\+?254|0)?[71][\dXx*\s]{6,}?)\s+on\s/i)||line.match(/from\s+(.+?)\s+on\s/i);
    let name=m?m[1]:'',phone=m&&m[2]?m[2].replace(/\s/g,''):'';

  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);

  if(sum/(d.length/4)<110)for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=255-d[i]}

  else if(r.needs){const list=(r.cands&&r.cands.length?r.cands:S.members);act=`<select data-sel="${i}"><option value="">Choose member…</option>${list.map(memOpt).join('')}</select><div class="btnrow"><button class="sm" data-a="assign" data-i="${i}">Assign</button>${can('members')?`<button class="sm s" data-a="addnew" data-i="${i}">+ New member</button>`:''}<button class="sm s" data-a="nav" data-v="disputes">⚠ Disputes</button></div>`}
  const sk=!r.done&&!r.needs;
  return`<div class="rc ${cls} ${sk?'sk':''}"><div class="ico">${ico}</div><div class="bd"><div class="nm">${esc(r.p.name||r.p.raw)}</div>${r.p.phone&&!sk?`<div class="m">${esc(r.p.phone)}</div>`:''}${r.m?`<div class="m">→ #${esc(r.m.no)} ${esc(r.m.name)}</div>`:''}<div class="m">${esc(r.undone?'Undone':r.t)}</div>${act}</div><div class="amt">${fmt(r.p.amount)}</div></div>`}
function resultsView(){const c=S.cases.find(x=>x.id===selCase);

function applyPay(cid,m,p){S.pay[cid][m.id]=p.amount;if(p.code)S.seen.push(p.code);let note='';
  if(!ph9(m.phone)&&ph9(p.phone)&&!isMasked(p.phone)){m.phone='0'+ph9(p.phone);note=' · phone saved'}return note}
function resolveFor(p,c){(S.disputes||[]).forEach(d=>{if(d.status==='open'&&d.caseId===c.id&&d.amount===p.amount&&d.code===(p.code||'')&&norm(d.name).join(' ')===norm(p.name).join(' '))d.status='done'})}
function processEntries(c,entries,gl){
  lastRes=[];
  entries.forEach(p=>{
    if(p.code&&S.seen.includes(p.code)){lastRes.push({p,s:'g',skip:true,t:'Already recorded earlier (same transaction code)'});return}
    const f=findMember(S.members,p);
    if(f.m){const cur=paidOf(c,f.m);
      if(cur>0){
        if(gl||onlyNew){lastRes.push({p,m:f.m,s:'g',skip:true,t:'Already paid '+fmt(cur)+' – left unchanged'});return}
        const st=addDispute(c,p,'Already paid '+fmt(cur)+' – possible double payment',[f.m]);
        if(st==='done'){lastRes.push({p,m:f.m,s:'g',skip:true,t:'Double payment already reviewed – ignored'});return}
        lastRes.push({p,m:f.m,s:'wn',skip:true,did:st==='new'?1:0,t:`Already paid ${fmt(cur)} – possible double payment (saved to Disputes)`});return}
      const note=applyPay(c.id,f.m,p);
      lastRes.push({p,m:f.m,cid:c.id,s:(f.weak&&!gl)?'wn':'ok',done:true,t:'Matched by '+f.how+note+((f.weak&&!gl)?' – please verify':'')})}
    else{
      const amb=!!f.amb,st=addDispute(c,p,amb?'Several members match this name':'Not found in the register',f.amb||[]);
      if(st==='done'){lastRes.push({p,s:'g',skip:true,t:'Already handled in Disputes – ignored'});return}
      lastRes.push(amb?{p,s:'er',needs:true,cands:f.amb,did:st==='new'?1:0,t:'Several members match – pick the right one'}:{p,s:'wn',needs:true,did:st==='new'?1:0,t:'Not found in register – saved to Disputes'})}});
  const n=lastRes.filter(r=>r.done).length,k=lastRes.filter(r=>r.did).length;
  log(`${gl?'Group list':'Matched'}: ${n} of ${lastRes.length} recorded into ${c.title}${k?`, ${k} sent to Disputes`:''}`);
  recText='';ssFiles.forEach(f=>URL.revokeObjectURL(f.url));ssFiles=[];resTab=null;
  save();render();toast(`✔ ${n} recorded${k?` · ${k} in Disputes`:''}`);setTimeout(()=>$('#results')?.scrollIntoView({behavior:'smooth'}),50)}
function runRecord(){
  const c=S.cases.find(x=>x.id===selCase);if(!c)return;
  if(!recText.trim())return toast('Paste or read some messages first');
  if(!S.members.length)return toast('Add or import members first');
  if(recMode!=='gl'&&+recAmt)S.defAmt=+recAmt;
  const es=entriesFromText();
  if(!es.length)return toast('No payments found in that text');
  processEntries(c,es,recMode==='gl')}

  ${cands.length?`<div class="m" style="margin-top:8px"><b>Possible members:</b></div>${cands.map(m=>`<div class="row" style="cursor:default;padding:6px 0"><div class="t"><b>${esc(m.name)}</b><span class="m" style="white-space:normal">#${esc(m.no)} · 🏫 ${esc(m.station)||'no school'} · 📱 ${esc(m.phone)||'no phone'}</span></div></div>${btns(m.phone,m.name.split(' ')[0])}`).join('')}`:''}

    const c=S.cases.find(x=>x.id==d.c),a=+d.a;if(a>stats(c).col-approvedOut(c)-pendingOut(c)){toast('More than is available for this case');return false}
    S.payouts.push({id:uid(),caseId:c.id,amount:a,to:d.to.trim(),note:d.note.trim(),by:who(),date:Date.now(),status:'pending'});log(`Requested payout ${fmt(a)} (${c.title})`);save();render();toast('Sent to Chairperson for approval')},'Submit');break}
  case'payoutAct':{const p=S.payouts.find(x=>x.id==d.id);p.status=d.s;p.decidedBy=who();log(`${d.s==='approved'?'Approved':'Rejected'} payout ${fmt(p.amount)} to ${p.to}`);save();render();toast(d.s==='approved'?'✔ Approved':'Rejected');break}
  case'export':exportXlsx();break;
  case'import':{const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=async()=>{const f=i.files[0];if(!f)return;
      if(!await loadXLSX())return;const wb=XLSX.read(await f.arrayBuffer());const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
      S.members.length?confirmBox(`This will <b>replace</b> the ${S.members.length} members and ${S.cases.length} cases on this phone with the spreadsheet. Continue?`,()=>importAoa(aoa),'Replace'):importAoa(aoa)};i.click();break}
  case'oldimport':{const o=JSON.parse(localStorage.getItem('welfare_state_v1'));importAoa(o.aoa);break}
  case'backup':dl(`NSCJSTA_backup_${stamp()}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}));log('Made backup');save();break;
  case'restore':{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());if(!o.members||!o.officials)throw 0;
      Object.values(o.officials).forEach(x=>{delete x.pin});
      confirmBox('Replace ALL data with this backup? This changes it for every official.',()=>{S=Object.assign(fresh(),o);log('Restored a backup');save();render();toast('Backup restored')},'Restore')}catch(e){toast('That is not a valid backup file')}};i.click();break}
  case'official':{const k=d.r;if(k==='chair'&&role!=='chair')return toast('Only the Chairperson can change these details');modal(ROLES[k].t,`<label>Name</label><input name="n" value="${esc(S.officials[k].name)}" required>`,f=>{
    S.officials[k].name=f.n.trim();log(`Updated ${ROLES[k].t} name`);save();render();toast('✔ Saved')});break}
  case'chpw':modal('Change my password',`<label>New password (6 or more characters)</label><input name="p" type="password" minlength="6" required autocomplete="new-password"><label>Repeat it</label><input name="q" type="password" minlength="6" required autocomplete="new-password">`,f=>{
    if(f.p!==f.q){toast('The two passwords differ');return false}
    auth.currentUser.updatePassword(f.p).then(()=>toast('✔ Password changed'),e=>toast(e.code==='auth/requires-recent-login'?'Sign out, sign in again, then retry':'Could not change: '+(e.code||e.message)))});break
  case'rights':S.fullRights=S.fullRights===false;log('Full rights for officials turned '+(S.fullRights?'ON':'OFF'));save();render();break;
  case'reset':if(role!=='chair')return toast('Only the Chairperson can do this');modal('Erase everything?',`<p>This deletes all members, cases, payments and payouts for <b>every official</b>. Type <b>ERASE</b> to confirm.</p><input name="w" autocomplete="off">`,f=>{if(f.w!=='ERASE'){toast('Type ERASE exactly');return false}S=Object.assign(fresh(),{officials:S.officials});log('Erased all data');save();render()},'Erase');break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.closest('a')&&b.tagName==='BUTTON'&&!b.dataset.a)return;act(b.dataset.a,b.dataset,b)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.in==='members')$('#lst').innerHTML=memberList(t.value);
  if(t.dataset.in==='case')$('#lst').innerHTML=caseList(S.cases.find(c=>c.id===arg),t.value);
  if(t.dataset.in==='rtext'){recText=t.value;clearTimeout(detT);detT=setTimeout(updateDet,150)}
  if(t.dataset.in==='ramt'){recAmt=t.value;updateDet()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.in==='rcase'){selCase=+t.value;lastRes=[];resTab=null;recAmt=null;render()}
  if(t.dataset.in==='onlynew'){onlyNew=t.checked;updateDet()}
  if(t.dataset.in==='gamt'){gAmt=t.checked;render()}});
document.addEventListener('toggle',e=>{if(e.target.id==='shd')shareOpen=e.target.open},true);
document.addEventListener('submit',e=>{
  if(e.target.id==='setup'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    S.officials={};for(const k in ROLES)S.officials[k]={name:d[k+'n'].trim()};
    log('Association set up');save();render();toast('Welcome, Chairperson!')}
  if(e.target.id==='pinf'){e.preventDefault();const p=$('#pin'),btn=e.target.querySelector('.go2');if(!p.value)return;btn.disabled=true;
    auth.signInWithEmailAndPassword(EMAIL[pickR],p.value).then(()=>{view='home'}).catch(err=>{p.value='';p.classList.add('shake');setTimeout(()=>p.classList.remove('shake'),400);
      toast(err.code==='auth/network-request-failed'?'No internet connection':['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code)?'Wrong password':err.code==='auth/too-many-requests'?'Too many tries – wait a few minutes':'Sign-in failed: '+(err.code||err.message))}).finally(()=>{btn.disabled=false})}});
const oldData=()=>{try{return JSON.parse(localStorage.getItem('welfare_state_v1')||'null')?.aoa}catch(e){return null}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
